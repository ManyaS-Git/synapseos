services:
  - type: web
    name: synapseos-api
    runtime: python
    plan: free
    region: oregon
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: STORAGE_MODE
        value: local_embedded
      - key: PRIVACY_MODE
        value: hybrid
      - key: APP_SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://synapseos-web.vercel.app,https://synapseos.vercel.app,http://localhost:3000"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: RATE_LIMIT_DEFAULT
        value: "100/minute"
      - key: AUTH_RATE_LIMIT
        value: "10/minute"
      - key: ENABLE_DOCS_IN_PRODUCTION
        value: "true"
