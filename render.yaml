services:
  - type: web
    name: synapseos-api
    runtime: python
    plan: free
    region: oregon
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: STORAGE_MODE
        value: local_embedded
      - key: PRIVACY_MODE
        value: hybrid
      - key: APP_SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://synapseos-three.vercel.app,https://synapseos-web.vercel.app,https://synapseos.vercel.app,http://localhost:3000"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: RATE_LIMIT_DEFAULT
        value: "100/minute"
      - key: AUTH_RATE_LIMIT
        value: "10/minute"
      - key: ENABLE_DOCS_IN_PRODUCTION
        value: "true"
      - key: NEBIUS_BASE_URL
        value: "https://api.tokenfactory.nebius.com/v1"
      - key: NEBIUS_MODEL
        value: "nvidia/Llama-3.1-Nemotron-70B-Instruct-HF"
      - key: NEBIUS_API_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        value: "pk_test_dHJ1c3R5LW11bGxldC0zMzEwLmNsZXJrLmFjY291bnRzLmRldiQ"
      - key: CLERK_ISSUER
        value: "https://trusty-mullet-3310.clerk.accounts.dev"
      - key: CLERK_JWKS_URL
        value: "https://trusty-mullet-3310.clerk.accounts.dev/.well-known/jwks.json"
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_JWT_KEY
        sync: false
