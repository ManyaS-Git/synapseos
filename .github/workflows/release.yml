name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          # TODO: Implement proper changelog generation
          echo "changelog=See [CHANGELOG.md](CHANGELOG.md) for details." >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## SynapseOS ${{ github.ref_name }}

            ${{ steps.changelog.outputs.changelog }}

            ### Docker

            ```bash
            git clone https://github.com/synapseos/synapseos.git
            cd synapseos
            git checkout ${{ github.ref_name }}
            cp .env.example .env
            docker compose up -d
            ```
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
